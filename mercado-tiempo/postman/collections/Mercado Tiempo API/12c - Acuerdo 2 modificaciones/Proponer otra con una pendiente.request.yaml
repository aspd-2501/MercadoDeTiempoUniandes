$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/solicitudes-modificacion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "MODIFICACION",
      "solicitanteId": "{{perfilA}}",
      "horas": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: ya tiene una solicitud de modificación pendiente", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("ya tiene una solicitud de modificación pendiente"); });
    language: text/javascript
order: 13000
