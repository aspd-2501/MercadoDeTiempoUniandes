$kind: http-request
url: "{{baseUrl}}/posts-comunitarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Así nos fue en la tutoría {{runId}}",
      "descripcion": "Gracias Ana por la paciencia",
      "imagen": "https://picsum.photos/500",
      "fechaCreacion": "{{ahora}}",
      "creadorId": "{{perfilB}}",
      "acuerdoId": "{{acuerdo1}}",
      "perfilIds": [
        "{{perfilB}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 2000
