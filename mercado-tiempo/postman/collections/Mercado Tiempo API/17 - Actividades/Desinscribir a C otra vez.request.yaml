$kind: http-request
url: "{{baseUrl}}/actividades/{{actividadId}}/perfiles/{{perfilC}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: not enrolled", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not enrolled"); });
    language: text/javascript
order: 21000
