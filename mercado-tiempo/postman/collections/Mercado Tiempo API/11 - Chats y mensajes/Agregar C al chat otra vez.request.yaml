$kind: http-request
url: "{{baseUrl}}/chats/{{chatId}}/perfiles/{{perfilC}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: ya es participante", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("ya es participante"); });
    language: text/javascript
order: 8000
