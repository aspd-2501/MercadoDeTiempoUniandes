$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilE}}/servicios-ofrecidos?ocultos=true"
method: GET
queryParams:
  ocultos: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Incluye el oculto", () => { const r = pm.response.json(); pm.expect(r.map(s => s.id)).to.include(pm.collectionVariables.get("servicioOcultoId")); });
    language: text/javascript
order: 10000
