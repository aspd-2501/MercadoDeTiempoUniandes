$kind: http-request
url: "{{baseUrl}}/posts-ayuda"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Tutoría de Cálculo Integral {{runId}}",
      "descripcion": "Repaso para el parcial",
      "horas": 2,
      "imagen": "https://picsum.photos/400",
      "ofrece": true,
      "cupo": 3,
      "cupoLleno": false,
      "fechaCreacion": "{{ahora}}",
      "perfilAutorId": "{{perfilA}}",
      "categoriaIds": [
        "{{cat1}}"
      ],
      "horarios": [
        {
          "fechaInicio": "{{pasadoInicio}}",
          "fechaFin": "{{pasadoFin}}"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Tiene id UUID", () => { const r = pm.response.json(); pm.expect(r.id).to.match(/^[0-9a-f-]{36}$/); });
      { const r = pm.response.json(); pm.collectionVariables.set("postId", r.id); }
    language: text/javascript
order: 1000
