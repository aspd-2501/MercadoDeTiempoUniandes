$kind: http-request
url: "{{baseUrl}}/perfiles-organizacion/{{orgId}}/miembros/{{perfilC}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: no es miembro", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("no es miembro"); });
    language: text/javascript
order: 12000
