$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/calendario?desde=ayer&hasta={{hasta}}"
method: GET
queryParams:
  desde: ayer
  hasta: "{{hasta}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Mensaje: valid dates", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("valid dates"); });
    language: text/javascript
order: 8000
