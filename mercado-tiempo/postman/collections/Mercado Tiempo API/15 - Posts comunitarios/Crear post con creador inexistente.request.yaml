$kind: http-request
url: "{{baseUrl}}/posts-comunitarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Así nos fue en la tutoría {{runId}}",
      "descripcion": "Gracias Ana por la paciencia",
      "imagen": "https://picsum.photos/500",
      "fechaCreacion": "{{ahora}}",
      "creadorId": "{{idInexistente}}",
      "acuerdoId": "{{acuerdo1}}",
      "perfilIds": [
        "{{perfilA}}",
        "{{perfilB}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
