$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fotos para la feria {{runId}}",
      "descripcion": "Necesito fotos del stand",
      "fechaCreacion": "{{ahora}}",
      "horas": 1,
      "perfilAutorId": "{{perfilB}}",
      "prestadorId": "{{orgId}}",
      "servicioOfrecidoId": "{{servicioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Tiene id UUID", () => { const r = pm.response.json(); pm.expect(r.id).to.match(/^[0-9a-f-]{36}$/); });
      pm.test("No aceptada al crearse", () => { const r = pm.response.json(); pm.expect(r.aceptada).to.eql(false); });
      { const r = pm.response.json(); pm.collectionVariables.set("solicitudId", r.id); }
    language: text/javascript
order: 1000
