$kind: http-request
url: "{{baseUrl}}/horarios-disponibles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fechaInicio": "{{futuroInicio}}",
      "fechaFin": "{{futuroFin}}",
      "perfilId": "{{perfilA}}",
      "solicitudId": "{{solicitudId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("horarioSolicitudId", r.id); }
    language: text/javascript
order: 6000
