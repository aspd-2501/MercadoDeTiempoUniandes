$kind: http-request
url: "{{baseUrl}}/acuerdos/iniciar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "postAyudaId": "{{postId}}",
      "perfilId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: El perfil ya participa en un acuerdo de este post", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("El perfil ya participa en un acuerdo de este post"); });
    language: text/javascript
order: 13050
