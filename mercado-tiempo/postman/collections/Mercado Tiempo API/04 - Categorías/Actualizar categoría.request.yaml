$kind: http-request
url: "{{baseUrl}}/categorias/{{cat4}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Idiomas y culturas {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Nombre actualizado", () => { const r = pm.response.json(); pm.expect(r.nombre).to.include("culturas"); });
    language: text/javascript
order: 9000
