$kind: http-request
description: Genera un sufijo único (runId) y fechas relativas a hoy para que la colección se pueda correr muchas veces sobre la misma base de datos.
url: "{{baseUrl}}/categorias"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      
      const now = Date.now();
      pm.collectionVariables.set("runId", String(now));
      const d = new Date(now - 2 * 24 * 3600 * 1000); d.setUTCHours(13, 0, 0, 0);
      const iso = (x) => new Date(x).toISOString();
      const h = 3600 * 1000;
      pm.collectionVariables.set("ahora", iso(now));
      pm.collectionVariables.set("pasadoInicio", iso(d.getTime()));            // post: 13:00 - 17:00 (hace 2 días)
      pm.collectionVariables.set("pasadoFin", iso(d.getTime() + 4 * h));
      pm.collectionVariables.set("pasadoCoincInicio", iso(d.getTime() + 1 * h)); // receptor: 14:00 - 16:00
      pm.collectionVariables.set("pasadoCoincFin", iso(d.getTime() + 3 * h));
      pm.collectionVariables.set("pasadoCorto", iso(d.getTime() + 1 * h));      // franja de 1 h (muy corta)
      const f = new Date(now + 10 * 24 * h); f.setUTCHours(15, 0, 0, 0);
      pm.collectionVariables.set("futuroInicio", iso(f.getTime()));
      pm.collectionVariables.set("futuroFin", iso(f.getTime() + 3 * h));
      pm.collectionVariables.set("futuroOtro", iso(f.getTime() + 24 * h));
      pm.collectionVariables.set("desde", iso(now - 7 * 24 * h).slice(0, 10));
      pm.collectionVariables.set("hasta", iso(now + 30 * 24 * h).slice(0, 10));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve un arreglo (≥ 0)", () => { const r = pm.response.json(); pm.expect(r).to.be.an("array"); pm.expect(r.length).to.be.at.least(0); });
    language: text/javascript
order: 1000
