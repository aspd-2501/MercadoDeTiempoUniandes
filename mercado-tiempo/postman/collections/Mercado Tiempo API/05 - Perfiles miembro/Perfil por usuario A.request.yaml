$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/usuario/{{usuarioA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Es el perfil de A", () => { const r = pm.response.json(); pm.expect(r.id).to.eql(pm.collectionVariables.get("perfilA")); });
      pm.test("No expone la contraseña del usuario", () => { const r = pm.response.json(); pm.expect(r.usuario).to.not.have.property("contrasenia"); });
    language: text/javascript
order: 11300
