$kind: http-request
url: "{{baseUrl}}/organizaciones-institucionales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Temporal {{runId}}",
      "descripcion": "Bienestar universitario",
      "imagen": "https://picsum.photos/350"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("orgInstTmp", r.id); }
    language: text/javascript
order: 24000
