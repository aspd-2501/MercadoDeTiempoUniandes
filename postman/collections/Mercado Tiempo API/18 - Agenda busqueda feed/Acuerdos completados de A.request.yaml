$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/acuerdos?filtro=completados"
method: GET
queryParams:
  filtro: completados
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Incluye el acuerdo 1 y todos están realizados", () => { const r = pm.response.json(); pm.expect(r.map(a => a.id)).to.include(pm.collectionVariables.get("acuerdo1")); r.forEach(a => pm.expect(a.estado).to.eql(2)); });
    language: text/javascript
order: 2000
