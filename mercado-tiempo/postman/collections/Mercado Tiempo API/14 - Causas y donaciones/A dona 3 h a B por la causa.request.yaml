$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 3,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "perfilDonanteId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}",
      "causaId": "{{causaId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Tiene id UUID", () => { const r = pm.response.json(); pm.expect(r.id).to.match(/^[0-9a-f-]{36}$/); });
      { const r = pm.response.json(); pm.collectionVariables.set("donacionId", r.id); }
    language: text/javascript
order: 11000
