$kind: http-request
url: "{{baseUrl}}/posts-comunitarios/{{postComId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Así nos fue en la tutoría {{runId}}",
      "descripcion": "Gracias Ana por la paciencia",
      "imagen": "https://picsum.photos/500",
      "fechaCreacion": "{{ahora}}",
      "creadorId": "{{perfilB}}",
      "acuerdoId": "{{acuerdo1}}",
      "likes": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("likes", () => { const r = pm.response.json(); pm.expect(r.likes).to.eql(5); });
    language: text/javascript
order: 7000
