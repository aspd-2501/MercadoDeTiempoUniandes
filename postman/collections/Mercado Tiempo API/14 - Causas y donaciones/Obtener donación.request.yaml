$kind: http-request
url: "{{baseUrl}}/donaciones/{{donacionId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("horas", () => { const r = pm.response.json(); pm.expect(r.horasDonadas).to.eql(3); });
      pm.test("causa", () => { const r = pm.response.json(); pm.expect(r.causa.id).to.eql(pm.collectionVariables.get("causaId")); });
    language: text/javascript
order: 28000
