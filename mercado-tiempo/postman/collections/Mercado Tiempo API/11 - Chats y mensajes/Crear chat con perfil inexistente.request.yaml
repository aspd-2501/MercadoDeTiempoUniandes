$kind: http-request
url: "{{baseUrl}}/chats"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "perfilIds": [
        "{{perfilA}}",
        "{{idInexistente}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
