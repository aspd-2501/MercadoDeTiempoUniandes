$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 2,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "perfilDonanteId": "{{perfilA}}",
      "depositoReceptorId": "{{fondoId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 14000
