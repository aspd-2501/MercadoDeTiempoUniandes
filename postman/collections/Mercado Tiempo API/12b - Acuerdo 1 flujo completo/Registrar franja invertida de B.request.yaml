$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/disponibilidad/{{perfilB}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "franjas": [
        {
          "fechaInicio": "{{pasadoCoincFin}}",
          "fechaFin": "{{pasadoCoincInicio}}"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: fechaFin of a horario must be after", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("fechaFin of a horario must be after"); });
    language: text/javascript
order: 14000
