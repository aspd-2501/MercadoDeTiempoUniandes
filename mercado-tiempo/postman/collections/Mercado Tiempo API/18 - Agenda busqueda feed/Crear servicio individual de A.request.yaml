$kind: http-request
url: "{{baseUrl}}/servicios-ofrecidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Servicio individual {{runId}}",
      "descripcion": "No debe salir en la búsqueda de servicios",
      "imagen": "https://picsum.photos/300",
      "visible": true,
      "perfilId": "{{perfilA}}",
      "categoriaIds": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("servicioIndividualId", r.id); }
    language: text/javascript
order: 17400
