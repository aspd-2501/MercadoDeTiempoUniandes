$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Temporal {{runId}}",
      "descripcion": "Necesito fotos del stand",
      "fechaCreacion": "{{ahora}}",
      "horas": 1,
      "perfilAutorId": "{{perfilB}}",
      "prestadorId": "{{orgId}}",
      "servicioOfrecidoId": "{{servicioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("solicitudTmp", r.id); }
    language: text/javascript
order: 13000
