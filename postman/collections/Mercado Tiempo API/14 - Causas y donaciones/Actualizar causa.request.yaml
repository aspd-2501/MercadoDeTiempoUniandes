$kind: http-request
url: "{{baseUrl}}/causas/{{causaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Libros para Bruno {{runId}}",
      "descripcion": "Horas para tutorías de física",
      "imagen": "https://picsum.photos/250",
      "perfilCreadorId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Descripción actualizada", () => { const r = pm.response.json(); pm.expect(r.descripcion).to.include("física"); });
    language: text/javascript
order: 7000
