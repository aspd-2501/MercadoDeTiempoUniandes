$kind: http-request
url: "{{baseUrl}}/reconocimientos/{{recId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Tutor estrella {{runId}}",
      "descripcion": "Por ayudar a sus compañeros",
      "requerimiento": "Completar 1 tutoría",
      "icono": "trophy"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("icono", () => { const r = pm.response.json(); pm.expect(r.icono).to.eql("trophy"); });
    language: text/javascript
order: 6000
