$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Perfil de quien tiene la sesión", () => { const r = pm.response.json(); pm.expect(r.perfil.id).to.eql(pm.collectionVariables.get("perfilA")); pm.expect(r.usuario.id).to.eql(pm.collectionVariables.get("usuarioA")); });
    language: text/javascript
order: 11200
