$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/posts-ayuda"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Incluye el post de A", () => { const r = pm.response.json(); pm.expect(r.some(p => p.id === pm.collectionVariables.get("postId"))).to.be.true; });
      pm.test("Todos son de A", () => { const r = pm.response.json(); r.forEach(p => pm.expect(p.perfilAutor.id).to.eql(pm.collectionVariables.get("perfilA"))); });
      pm.test("No incluye el post eliminado", () => { const r = pm.response.json(); pm.expect(r.some(p => p.id === pm.collectionVariables.get("postTmp"))).to.be.false; });
    language: text/javascript
order: 22000
