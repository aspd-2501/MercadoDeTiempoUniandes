$kind: http-request
url: "{{baseUrl}}/acuerdos/{{idInexistente}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horas": 2,
      "fechaCreacion": "{{ahora}}",
      "fechaRealizacion": "{{futuroInicio}}",
      "postAyudaId": "{{postId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 404", () => pm.response.to.have.status(404));
      pm.test("Mensaje: not found", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not found"); });
    language: text/javascript
order: 11000
