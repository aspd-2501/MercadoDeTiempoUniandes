$kind: http-request
url: "{{baseUrl}}/categorias/{{cat1}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("nombre correcto", () => { const r = pm.response.json(); pm.expect(r.nombre).to.eql("Académico " + pm.collectionVariables.get("runId")); });
    language: text/javascript
order: 7000
