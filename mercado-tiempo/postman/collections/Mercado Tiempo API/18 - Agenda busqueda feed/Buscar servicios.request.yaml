$kind: http-request
url: "{{baseUrl}}/buscar/servicios?q={{runId}}"
method: GET
queryParams:
  q: "{{runId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Solo posts de ofrecimiento y servicios de organizaciones", () => { const r = pm.response.json(); r.forEach(x => pm.expect(["POST_OFRECIMIENTO", "SERVICIO_ORGANIZACION"]).to.include(x.tipo)); });
      pm.test("Incluye el servicio de la organización E", () => { const r = pm.response.json(); const s = r.find(x => x.id === pm.collectionVariables.get("servicioId")); pm.expect(s.tipo).to.eql("SERVICIO_ORGANIZACION"); pm.expect(s.autor.esOrganizacion).to.be.true; });
      pm.test("No incluye el servicio individual de A", () => { const r = pm.response.json(); pm.expect(r.some(x => x.id === pm.collectionVariables.get("servicioIndividualId"))).to.be.false; });
      pm.test("Los servicios de organizaciones traen autor organización", () => { const r = pm.response.json(); r.filter(x => x.tipo === "SERVICIO_ORGANIZACION").forEach(x => pm.expect(x.autor.perfilOrganizacionId).to.be.a("string")); });
    language: text/javascript
order: 17500
