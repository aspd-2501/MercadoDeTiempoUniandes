$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda/{{solicitudId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Autor es B", () => { const r = pm.response.json(); pm.expect(r.perfilAutor.id).to.eql(pm.collectionVariables.get("perfilB")); });
    language: text/javascript
order: 7000
