$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/saldo"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "saldo": 20
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Saldo 20", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(20); });
    language: text/javascript
order: 9400
