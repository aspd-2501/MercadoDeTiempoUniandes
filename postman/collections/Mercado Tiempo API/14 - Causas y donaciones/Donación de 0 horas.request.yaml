$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 0,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "perfilDonanteId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 23000
