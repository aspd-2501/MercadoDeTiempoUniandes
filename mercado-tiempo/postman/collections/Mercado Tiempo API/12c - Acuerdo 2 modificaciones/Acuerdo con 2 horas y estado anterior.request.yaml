$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("horas 2", () => { const r = pm.response.json(); pm.expect(r.horas).to.eql(2); });
      pm.test("estado 1", () => { const r = pm.response.json(); pm.expect(r.estado).to.eql(1); });
    language: text/javascript
order: 18000
