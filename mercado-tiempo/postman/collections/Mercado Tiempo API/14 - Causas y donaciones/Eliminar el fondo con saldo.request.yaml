$kind: http-request
url: "{{baseUrl}}/depositos-horas/{{fondoId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: no se puede eliminar mientras tenga saldo", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("no se puede eliminar mientras tenga saldo"); });
    language: text/javascript
order: 30000
