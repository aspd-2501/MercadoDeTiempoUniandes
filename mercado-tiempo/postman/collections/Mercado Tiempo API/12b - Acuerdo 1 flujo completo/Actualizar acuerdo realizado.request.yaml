$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horas": 5,
      "fechaCreacion": "{{ahora}}",
      "fechaRealizacion": "{{futuroInicio}}",
      "postAyudaId": "{{postId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: ya se realizó y no se puede modificar", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("ya se realizó y no se puede modificar"); });
    language: text/javascript
order: 28000
