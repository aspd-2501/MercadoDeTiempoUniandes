$kind: http-request
url: "{{baseUrl}}/mensajes/{{mensajeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("contenido", () => { const r = pm.response.json(); pm.expect(r.contenido).to.eql("Hola Bruno, ¿te sirve el jueves?"); });
    language: text/javascript
order: 18000
