$kind: http-request
description: El servicio no verifica que la organización exista; la BD rechaza la FK y el API responde 500. Debería ser 404.
url: "{{baseUrl}}/actividades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Jornada de reforestación {{runId}}",
      "descripcion": "Siembra en los cerros orientales",
      "imagen": "https://picsum.photos/450",
      "cupo": 20,
      "cupoLleno": false,
      "fechaCreacion": "{{ahora}}",
      "organizacionId": "{{idInexistente}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
