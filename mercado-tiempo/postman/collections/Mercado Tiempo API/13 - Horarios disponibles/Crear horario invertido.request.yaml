$kind: http-request
url: "{{baseUrl}}/horarios-disponibles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fechaInicio": "{{futuroFin}}",
      "fechaFin": "{{futuroInicio}}",
      "perfilId": "{{perfilB}}",
      "solicitudId": "{{solicitudId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: fecha de fin debe ser posterior", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("fecha de fin debe ser posterior"); });
    language: text/javascript
order: 5000
