$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/participantes/{{perfilD}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rol": "RECEPTOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: not have enough saldo", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not have enough saldo"); });
    language: text/javascript
order: 5000
