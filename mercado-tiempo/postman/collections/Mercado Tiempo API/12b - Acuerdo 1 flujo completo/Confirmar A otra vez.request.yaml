$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/confirmaciones/{{perfilA}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
