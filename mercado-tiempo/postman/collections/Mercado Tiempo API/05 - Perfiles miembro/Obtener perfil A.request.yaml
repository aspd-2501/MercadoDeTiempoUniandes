$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("saldo", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(20); });
      pm.test("No expone la contraseña del usuario", () => { const r = pm.response.json(); if (r.usuario) pm.expect(r.usuario).to.not.have.property("contrasenia"); });
    language: text/javascript
order: 11000
