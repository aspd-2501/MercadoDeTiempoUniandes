$kind: http-request
url: "{{baseUrl}}/horarios-disponibles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fechaInicio": "{{futuroInicio}}",
      "fechaFin": "{{futuroFin}}",
      "perfilId": "{{idInexistente}}",
      "solicitudId": "{{solicitudId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
