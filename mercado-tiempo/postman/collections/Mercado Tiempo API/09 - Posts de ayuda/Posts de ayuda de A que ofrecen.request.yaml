$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/posts-ayuda?tipo=ofrecimiento"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Todos ofrecen ayuda", () => { const r = pm.response.json(); r.forEach(p => pm.expect(p.ofrece).to.be.true); });
    language: text/javascript
order: 22100
