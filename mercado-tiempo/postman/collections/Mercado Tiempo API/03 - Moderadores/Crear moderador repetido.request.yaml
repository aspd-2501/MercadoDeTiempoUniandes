$kind: http-request
url: "{{baseUrl}}/moderadores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuarioId": "{{usuarioC}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: ya es moderador", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("ya es moderador"); });
    language: text/javascript
order: 2000
