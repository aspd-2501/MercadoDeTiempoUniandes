$kind: http-request
url: "{{baseUrl}}/perfiles-organizacion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "perfilId": "{{idInexistente}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 404", () => pm.response.to.have.status(404));
      pm.test("Mensaje: not found", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not found"); });
    language: text/javascript
order: 3000
