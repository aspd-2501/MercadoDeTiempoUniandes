$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "",
      "descripcion": "Necesito fotos del stand",
      "fechaCreacion": "{{ahora}}",
      "horas": 1,
      "perfilAutorId": "{{perfilB}}",
      "prestadorId": "{{orgId}}",
      "servicioOfrecidoId": "{{servicioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 5000
