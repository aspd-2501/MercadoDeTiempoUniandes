$kind: http-request
url: "{{baseUrl}}/buscar/miembros?q=Ana Tutora {{runId}}&excluir={{perfilA}}"
method: GET
queryParams:
  q: Ana Tutora {{runId}}
  excluir: "{{perfilA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("No incluye a A", () => { const r = pm.response.json(); pm.expect(JSON.stringify(r)).to.not.include(pm.collectionVariables.get("perfilA")); });
    language: text/javascript
order: 10000
