$kind: http-request
url: "{{baseUrl}}/servicios-ofrecidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fotografía de eventos {{runId}}",
      "descripcion": "Cubro eventos estudiantiles",
      "imagen": "https://picsum.photos/300",
      "visible": true,
      "perfilId": "{{perfilE}}",
      "categoriaIds": [
        "{{cat1}}",
        "{{cat2}}",
        "{{cat3}}",
        "{{cat4}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 3000
