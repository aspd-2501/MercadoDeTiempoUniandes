$kind: http-request
url: "{{baseUrl}}/acuerdos/iniciar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "postAyudaId": "{{postId}}",
      "perfilId": "{{perfilD}}",
      "fechaRealizacion": "{{futuroInicio}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: saldo suficiente", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("saldo suficiente"); });
    language: text/javascript
order: 13400
