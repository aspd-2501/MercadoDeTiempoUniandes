$kind: http-request
url: "{{baseUrl}}/posts-ayuda/{{postId}}/horarios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Queda 1 horario y es el preferido", () => { const r = pm.response.json(); pm.expect(r.length).to.eql(1); pm.expect(r[0].preferido).to.be.true; });
    language: text/javascript
order: 15100
