$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/horario-acordado/{{horarioPostId}}"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: not associated with the acuerdo", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not associated with the acuerdo"); });
    language: text/javascript
order: 8000
