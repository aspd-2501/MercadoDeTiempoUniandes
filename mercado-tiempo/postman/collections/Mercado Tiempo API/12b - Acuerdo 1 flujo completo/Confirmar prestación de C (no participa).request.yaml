$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/confirmaciones/{{perfilC}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: not a participant", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not a participant"); });
    language: text/javascript
order: 20000
