$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilB}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("saldo B - 2", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(Number(pm.collectionVariables.get("saldoBAntes")) - 2); });
    language: text/javascript
order: 25000
