$kind: http-request
url: "{{baseUrl}}/depositos-horas/fondo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("saldo fondo = inicial + 2 - 1", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(Number(pm.collectionVariables.get("saldoFondoInicial")) + 1); });
    language: text/javascript
order: 16000
