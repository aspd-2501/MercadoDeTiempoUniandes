$kind: http-request
description: El servicio no verifica que el perfil exista; la BD rechaza la FK y el API responde 500. Debería ser 404.
url: "{{baseUrl}}/causas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Libros para Bruno {{runId}}",
      "descripcion": "Horas para tutorías",
      "imagen": "https://picsum.photos/250",
      "perfilCreadorId": "{{idInexistente}}",
      "perfilReceptorId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
