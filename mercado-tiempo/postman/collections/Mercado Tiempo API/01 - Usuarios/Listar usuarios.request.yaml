$kind: http-request
url: "{{baseUrl}}/usuarios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve un arreglo (≥ 5)", () => { const r = pm.response.json(); pm.expect(r).to.be.an("array"); pm.expect(r.length).to.be.at.least(5); });
      pm.test("Ninguno expone la contraseña", () => { const r = pm.response.json(); r.forEach(u => pm.expect(u).to.not.have.property("contrasenia")); });
    language: text/javascript
order: 9000
