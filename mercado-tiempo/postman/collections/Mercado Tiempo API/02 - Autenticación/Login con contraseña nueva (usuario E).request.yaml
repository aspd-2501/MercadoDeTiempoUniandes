$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idUniandes": "e.prueba{{runId}}",
      "contrasenia": "nuevaClave456"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
