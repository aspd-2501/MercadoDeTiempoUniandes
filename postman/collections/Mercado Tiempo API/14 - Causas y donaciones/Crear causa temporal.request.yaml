$kind: http-request
url: "{{baseUrl}}/causas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Temporal {{runId}}",
      "descripcion": "Horas para tutorías",
      "imagen": "https://picsum.photos/250",
      "perfilCreadorId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("causaTmp", r.id); }
    language: text/javascript
order: 31000
