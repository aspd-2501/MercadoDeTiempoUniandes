$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilC}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("saldo C + 1", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(Number(pm.collectionVariables.get("saldoC")) + 1); });
    language: text/javascript
order: 17000
