$kind: http-request
url: "{{baseUrl}}/organizaciones-institucionales"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Decanatura de Estudiantes {{runId}}",
      "descripcion": "Bienestar universitario",
      "imagen": "https://picsum.photos/350"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Tiene id UUID", () => { const r = pm.response.json(); pm.expect(r.id).to.match(/^[0-9a-f-]{36}$/); });
      { const r = pm.response.json(); pm.collectionVariables.set("orgInstId", r.id); }
    language: text/javascript
order: 1000
