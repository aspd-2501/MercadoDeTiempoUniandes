$kind: http-request
url: "{{baseUrl}}/acuerdos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horas": 2,
      "fechaCreacion": "{{ahora}}",
      "fechaRealizacion": "{{futuroInicio}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: de un post de ayuda o de una solicitud", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("de un post de ayuda o de una solicitud"); });
    language: text/javascript
order: 2000
