$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/participantes"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "participantes": [
        {
          "perfilId": "{{perfilA}}",
          "rol": "PRESTADOR"
        },
        {
          "perfilId": "{{perfilB}}",
          "rol": "RECEPTOR"
        },
        {
          "perfilId": "{{perfilC}}",
          "rol": "RECEPTOR"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("3 participantes", () => { const r = pm.response.json(); pm.expect(r.participantes.length).to.eql(3); });
    language: text/javascript
order: 3000
