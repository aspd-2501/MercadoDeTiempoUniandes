$kind: http-request
url: "{{baseUrl}}/causas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Libros para Bruno {{runId}}",
      "descripcion": "Horas para tutorías",
      "perfilCreadorId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 2000
