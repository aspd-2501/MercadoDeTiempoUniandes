$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/confirmaciones/{{perfilA}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: antes de la fecha de realización", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("antes de la fecha de realización"); });
    language: text/javascript
order: 5000
