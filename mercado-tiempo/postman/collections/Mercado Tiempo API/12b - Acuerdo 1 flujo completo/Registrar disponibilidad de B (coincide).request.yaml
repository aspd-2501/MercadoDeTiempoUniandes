$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/disponibilidad/{{perfilB}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "franjas": [
        {
          "fechaInicio": "{{pasadoCoincInicio}}",
          "fechaFin": "{{pasadoCoincFin}}"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("resultado compatible", () => { const r = pm.response.json(); pm.expect(r.resultado.estado).to.eql("compatible"); });
      pm.test("Se asignó horario acordado", () => { const r = pm.response.json(); pm.expect(r.horarioAcordado).to.not.be.null; });
    language: text/javascript
order: 15000
