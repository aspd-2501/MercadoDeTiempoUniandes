$kind: http-request
url: "{{baseUrl}}/actividades/{{actividadId}}/perfiles"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "perfilIds": [
        "{{perfilB}}",
        "{{perfilC}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 18000
