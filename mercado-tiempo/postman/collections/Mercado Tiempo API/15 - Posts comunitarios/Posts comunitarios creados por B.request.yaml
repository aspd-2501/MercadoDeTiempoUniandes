$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilB}}/posts-comunitarios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Incluye el post de A y B", () => { const r = pm.response.json(); pm.expect(r.some(p => p.id === pm.collectionVariables.get("postComId"))).to.be.true; });
      pm.test("Todos los creó B", () => { const r = pm.response.json(); r.forEach(p => pm.expect(p.creador.id).to.eql(pm.collectionVariables.get("perfilB"))); });
    language: text/javascript
order: 18000
