$kind: http-request
url: "{{baseUrl}}/acuerdos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horas": 2,
      "fechaCreacion": "{{ahora}}",
      "fechaRealizacion": "{{futuroInicio}}",
      "postAyudaId": "{{postId}}",
      "estado": 4
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 4000
