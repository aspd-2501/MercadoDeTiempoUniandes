$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/transacciones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Tiene SERVICIO_PRESTADO de +2", () => { const r = pm.response.json(); pm.expect(r.some(t => t.tipo === "SERVICIO_PRESTADO" && t.horas === 2)).to.be.true; });
    language: text/javascript
order: 26000
