$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}/participantes/{{perfilA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("rol PRESTADOR", () => { const r = pm.response.json(); pm.expect(r.rol).to.eql("PRESTADOR"); });
    language: text/javascript
order: 8000
