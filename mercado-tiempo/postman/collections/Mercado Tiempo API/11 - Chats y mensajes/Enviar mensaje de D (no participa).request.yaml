$kind: http-request
url: "{{baseUrl}}/mensajes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "contenido": "Hola",
      "emisorId": "{{perfilD}}",
      "chatId": "{{chatId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: not a participant in the chat", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("not a participant in the chat"); });
    language: text/javascript
order: 14000
