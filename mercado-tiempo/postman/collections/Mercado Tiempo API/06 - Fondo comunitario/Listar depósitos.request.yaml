$kind: http-request
url: "{{baseUrl}}/depositos-horas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve un arreglo (≥ 1)", () => { const r = pm.response.json(); pm.expect(r).to.be.an("array"); pm.expect(r.length).to.be.at.least(1); });
      pm.test("Solo existe un depósito", () => { const r = pm.response.json(); pm.expect(r.length).to.eql(1); });
    language: text/javascript
order: 1000
