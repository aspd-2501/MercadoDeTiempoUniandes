$kind: http-request
url: "{{baseUrl}}/buscar/posts-ayuda?tipo=regalo"
method: GET
queryParams:
  tipo: regalo
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Mensaje: tipo must be", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("tipo must be"); });
    language: text/javascript
order: 12000
