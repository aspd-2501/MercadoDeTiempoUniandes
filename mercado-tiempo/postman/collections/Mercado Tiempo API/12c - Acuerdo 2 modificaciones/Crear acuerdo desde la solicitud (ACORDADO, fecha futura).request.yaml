$kind: http-request
url: "{{baseUrl}}/acuerdos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horas": 1,
      "fechaCreacion": "{{ahora}}",
      "fechaRealizacion": "{{futuroInicio}}",
      "estado": 1,
      "solicitudId": "{{solicitudId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("estado 1", () => { const r = pm.response.json(); pm.expect(r.estado).to.eql(1); });
      { const r = pm.response.json(); pm.collectionVariables.set("acuerdo2", r.id); }
    language: text/javascript
order: 1000
