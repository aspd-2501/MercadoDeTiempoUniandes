$kind: http-request
url: "{{baseUrl}}/posts-ayuda/{{postId}}/horarios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("1 horario", () => { const r = pm.response.json(); pm.expect(r.length).to.eql(1); });
      { const r = pm.response.json(); pm.collectionVariables.set("horarioPostId", r[0].id); }
    language: text/javascript
order: 12000
