$kind: http-request
url: "{{baseUrl}}/perfiles-organizacion/{{orgId}}/miembros/{{perfilA}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: already a miembro", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("already a miembro"); });
    language: text/javascript
order: 9000
