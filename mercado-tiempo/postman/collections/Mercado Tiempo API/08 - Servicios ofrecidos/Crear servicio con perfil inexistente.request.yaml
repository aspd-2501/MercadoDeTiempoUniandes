$kind: http-request
url: "{{baseUrl}}/servicios-ofrecidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fotografía de eventos {{runId}}",
      "descripcion": "Cubro eventos estudiantiles",
      "imagen": "https://picsum.photos/300",
      "visible": true,
      "perfilId": "{{idInexistente}}",
      "categoriaIds": [
        "{{cat3}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 5000
