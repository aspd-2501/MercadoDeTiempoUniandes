$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo1}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("estado 1", () => { const r = pm.response.json(); pm.expect(r.estado).to.eql(1); });
      pm.test("fechaRealizacion = inicio de la coincidencia", () => { const r = pm.response.json(); pm.expect(new Date(r.fechaRealizacion).toISOString()).to.eql(pm.collectionVariables.get("pasadoCoincInicio")); });
    language: text/javascript
order: 16000
