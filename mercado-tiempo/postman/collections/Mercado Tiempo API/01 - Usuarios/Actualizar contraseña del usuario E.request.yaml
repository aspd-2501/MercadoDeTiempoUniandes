$kind: http-request
url: "{{baseUrl}}/usuarios/{{usuarioE}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idUniandes": "e.prueba{{runId}}",
      "contrasenia": "nuevaClave456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("No devuelve la contraseña", () => { const r = pm.response.json(); pm.expect(r).to.not.have.property("contrasenia"); });
    language: text/javascript
order: 12000
