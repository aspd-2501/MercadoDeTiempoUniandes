$kind: http-request
url: "{{baseUrl}}/posts-comunitarios/{{postComId}}/aprobaciones/{{perfilA}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: ya aprobó", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("ya aprobó"); });
    language: text/javascript
order: 9000
