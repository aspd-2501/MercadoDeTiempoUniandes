$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Fotos para la feria {{runId}}",
      "descripcion": "Necesito fotos del stand",
      "fechaCreacion": "{{ahora}}",
      "horas": 1,
      "perfilAutorId": "{{perfilB}}",
      "prestadorId": "{{idInexistente}}",
      "servicioOfrecidoId": "{{servicioId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 404", () => pm.response.to.have.status(404));
      pm.test("Mensaje: No se encontró la organización prestadora", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("No se encontró la organización prestadora"); });
    language: text/javascript
order: 3000
