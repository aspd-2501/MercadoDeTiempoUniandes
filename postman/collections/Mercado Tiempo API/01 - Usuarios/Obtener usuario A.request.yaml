$kind: http-request
url: "{{baseUrl}}/usuarios/{{usuarioA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("idUniandes correcto", () => { const r = pm.response.json(); pm.expect(r.idUniandes).to.eql("a.prueba" + pm.collectionVariables.get("runId")); });
    language: text/javascript
order: 10000
