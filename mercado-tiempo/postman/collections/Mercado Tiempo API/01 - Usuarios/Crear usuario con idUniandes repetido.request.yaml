$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idUniandes": "a.prueba{{runId}}",
      "contrasenia": "clave123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: Ya existe una cuenta", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("Ya existe una cuenta"); });
    language: text/javascript
order: 6000
