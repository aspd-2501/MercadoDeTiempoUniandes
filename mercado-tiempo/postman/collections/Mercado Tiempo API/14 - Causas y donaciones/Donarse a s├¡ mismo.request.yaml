$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 3,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "perfilDonanteId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilA}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: No puedes donarte horas a ti mismo", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("No puedes donarte horas a ti mismo"); });
    language: text/javascript
order: 20000
