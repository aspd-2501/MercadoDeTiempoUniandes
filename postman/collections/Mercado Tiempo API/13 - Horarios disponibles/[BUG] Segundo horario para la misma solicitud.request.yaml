$kind: http-request
description: La relación horario–solicitud es 1 a 1, pero el servicio no lo valida y la BD responde con un 500. Debería ser 412.
url: "{{baseUrl}}/horarios-disponibles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fechaInicio": "{{futuroInicio}}",
      "fechaFin": "{{futuroFin}}",
      "perfilId": "{{perfilB}}",
      "solicitudId": "{{solicitudId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 412", () => pm.response.to.have.status(412));
    language: text/javascript
order: 2000
