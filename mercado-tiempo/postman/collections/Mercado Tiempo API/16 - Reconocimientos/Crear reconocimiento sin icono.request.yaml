$kind: http-request
url: "{{baseUrl}}/reconocimientos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Tutor estrella {{runId}}",
      "descripcion": "Por ayudar a sus compañeros",
      "requerimiento": "Completar 1 tutoría"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Error de validación", () => { const r = pm.response.json(); pm.expect(r.message).to.exist; });
    language: text/javascript
order: 2000
