$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilE}}/servicios-ofrecidos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("No incluye el oculto", () => { const r = pm.response.json(); pm.expect(r.map(s => s.id)).to.not.include(pm.collectionVariables.get("servicioOcultoId")); });
    language: text/javascript
order: 9000
