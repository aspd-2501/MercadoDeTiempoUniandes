$kind: http-request
url: "{{baseUrl}}/chats/{{chatIniciadoId}}/perfiles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("A y B en el chat", () => { const r = pm.response.json(); const ids = r.map(p => p.idPerfil ?? p.id); pm.expect(ids).to.include(pm.collectionVariables.get("perfilA")); pm.expect(ids).to.include(pm.collectionVariables.get("perfilB")); pm.expect(r.length).to.eql(2); });
    language: text/javascript
order: 13100
