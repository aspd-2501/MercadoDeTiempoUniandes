$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/calendario?desde={{hasta}}&hasta={{desde}}"
method: GET
queryParams:
  desde: "{{hasta}}"
  hasta: "{{desde}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Mensaje: hasta must be after desde", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("hasta must be after desde"); });
    language: text/javascript
order: 7000
