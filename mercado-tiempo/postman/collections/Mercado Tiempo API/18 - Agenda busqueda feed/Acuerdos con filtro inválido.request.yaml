$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}/acuerdos?filtro=todos"
method: GET
queryParams:
  filtro: todos
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 400", () => pm.response.to.have.status(400));
      pm.test("Mensaje: filtro must be", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("filtro must be"); });
    language: text/javascript
order: 4000
