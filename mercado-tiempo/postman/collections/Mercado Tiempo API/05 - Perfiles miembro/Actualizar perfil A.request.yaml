$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana Tutora {{runId}}",
      "edad": 21,
      "afiliacionUniandes": "Estudiante",
      "imagen": "https://picsum.photos/200",
      "descripcion": "Tutora de cálculo y física",
      "estadoActividad": true,
      "saldo": 20,
      "usuarioId": "{{usuarioA}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("descripción actualizada", () => { const r = pm.response.json(); pm.expect(r.descripcion).to.eql("Tutora de cálculo y física"); });
    language: text/javascript
order: 13000
