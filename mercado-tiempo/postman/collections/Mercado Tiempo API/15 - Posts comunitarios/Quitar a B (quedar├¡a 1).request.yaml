$kind: http-request
url: "{{baseUrl}}/posts-comunitarios/{{postComId}}/participantes/{{perfilB}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: al menos 2 participantes", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("al menos 2 participantes"); });
    language: text/javascript
order: 15000
