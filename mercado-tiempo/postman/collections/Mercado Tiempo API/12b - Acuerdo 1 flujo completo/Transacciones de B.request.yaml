$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilB}}/transacciones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Tiene SERVICIO_RECIBIDO de -2", () => { const r = pm.response.json(); pm.expect(r.some(t => t.tipo === "SERVICIO_RECIBIDO" && t.horas === -2)).to.be.true; });
    language: text/javascript
order: 27000
