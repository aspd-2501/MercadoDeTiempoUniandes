$kind: http-request
url: "{{baseUrl}}/posts-comunitarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Así nos fue en la tutoría {{runId}}",
      "descripcion": "Gracias Ana por la paciencia",
      "imagen": "https://picsum.photos/500",
      "fechaCreacion": "{{ahora}}",
      "creadorId": "{{perfilB}}",
      "acuerdoId": "{{acuerdo1}}",
      "perfilIds": [
        "{{perfilA}}",
        "{{perfilB}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Tiene id UUID", () => { const r = pm.response.json(); pm.expect(r.id).to.match(/^[0-9a-f-]{36}$/); });
      { const r = pm.response.json(); pm.collectionVariables.set("postComId", r.id); }
    language: text/javascript
order: 1000
