$kind: http-request
url: "{{baseUrl}}/posts-ayuda/{{postId}}/categorias"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoriaIds": [
        "{{cat1}}",
        "{{cat4}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 17000
