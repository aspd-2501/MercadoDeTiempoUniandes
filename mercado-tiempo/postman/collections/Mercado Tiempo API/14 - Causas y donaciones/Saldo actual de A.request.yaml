$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      { const r = pm.response.json(); pm.collectionVariables.set("saldoA", r.saldo); }
    language: text/javascript
order: 8000
