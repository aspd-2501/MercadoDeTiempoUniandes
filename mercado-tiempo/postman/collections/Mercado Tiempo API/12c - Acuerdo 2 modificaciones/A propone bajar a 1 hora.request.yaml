$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/solicitudes-modificacion"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "MODIFICACION",
      "solicitanteId": "{{perfilA}}",
      "horas": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("modif3", r.id); }
    language: text/javascript
order: 25000
