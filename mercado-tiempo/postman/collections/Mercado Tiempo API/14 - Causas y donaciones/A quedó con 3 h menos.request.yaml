$kind: http-request
url: "{{baseUrl}}/perfiles-miembro/{{perfilA}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("saldo A - 3", () => { const r = pm.response.json(); pm.expect(r.saldo).to.eql(Number(pm.collectionVariables.get("saldoA")) - 3); });
    language: text/javascript
order: 12000
