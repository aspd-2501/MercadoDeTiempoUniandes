$kind: http-request
url: "{{baseUrl}}/depositos-horas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "saldo": 0
    }
scripts:
  - type: afterResponse
    code: |-
      
      if (pm.collectionVariables.get("fondoExistia") === "si") {
        pm.test("Código 412: solo puede haber un fondo", () => pm.response.to.have.status(412));
      } else {
        pm.test("Código 201", () => pm.response.to.have.status(201));
        pm.collectionVariables.set("fondoId", pm.response.json().id);
      }
    language: text/javascript
order: 3000
