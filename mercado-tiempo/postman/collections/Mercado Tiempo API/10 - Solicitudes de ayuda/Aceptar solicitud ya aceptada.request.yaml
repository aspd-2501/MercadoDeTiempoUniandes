$kind: http-request
url: "{{baseUrl}}/solicitudes-ayuda/{{solicitudId}}/aceptar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: already aceptada", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("already aceptada"); });
    language: text/javascript
order: 12000
