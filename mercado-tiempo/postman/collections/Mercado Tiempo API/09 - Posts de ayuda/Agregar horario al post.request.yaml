$kind: http-request
url: "{{baseUrl}}/posts-ayuda/{{postId}}/horarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fechaInicio": "{{futuroInicio}}",
      "fechaFin": "{{futuroFin}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 200/201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 13000
