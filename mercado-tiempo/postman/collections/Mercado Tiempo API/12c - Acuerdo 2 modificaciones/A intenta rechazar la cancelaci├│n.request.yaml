$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/solicitudes-modificacion/{{cancel1}}/rechazar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "perfilId": "{{perfilA}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: no se puede rechazar", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("no se puede rechazar"); });
    language: text/javascript
order: 32000
