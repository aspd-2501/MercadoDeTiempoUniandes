$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 3,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "perfilDonanteId": "{{perfilA}}",
      "perfilReceptorId": "{{perfilB}}",
      "causaId": "{{idInexistente}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 404", () => pm.response.to.have.status(404));
      pm.test("Mensaje: No se encontró la causa", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("No se encontró la causa"); });
    language: text/javascript
order: 25000
