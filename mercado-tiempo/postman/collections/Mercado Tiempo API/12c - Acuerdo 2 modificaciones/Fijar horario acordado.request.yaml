$kind: http-request
url: "{{baseUrl}}/acuerdos/{{acuerdo2}}/horario-acordado/{{horarioSolicitudId}}"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("horario asignado", () => { const r = pm.response.json(); pm.expect(r.horarioAcordado.id).to.eql(pm.collectionVariables.get("horarioSolicitudId")); });
    language: text/javascript
order: 7000
