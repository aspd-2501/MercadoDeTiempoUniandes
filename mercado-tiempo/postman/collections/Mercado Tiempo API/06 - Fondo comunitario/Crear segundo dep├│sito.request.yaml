$kind: http-request
url: "{{baseUrl}}/depositos-horas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "saldo": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: El fondo comunitario ya existe", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("El fondo comunitario ya existe"); });
    language: text/javascript
order: 4000
