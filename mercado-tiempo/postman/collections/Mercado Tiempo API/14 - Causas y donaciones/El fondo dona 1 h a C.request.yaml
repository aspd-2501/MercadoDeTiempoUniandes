$kind: http-request
url: "{{baseUrl}}/donaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "horasDonadas": 1,
      "fechaDonacion": "{{ahora}}",
      "mensaje": "¡Ánimo!",
      "depositoDonanteId": "{{fondoId}}",
      "perfilReceptorId": "{{perfilC}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 15000
