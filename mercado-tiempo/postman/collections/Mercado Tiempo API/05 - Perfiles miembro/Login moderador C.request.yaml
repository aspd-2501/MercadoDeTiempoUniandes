$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idUniandes": "c.prueba{{runId}}",
      "contrasenia": "clave123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.test("Es moderador", () => { const r = pm.response.json(); pm.expect(r.esModerador).to.be.true; });
      { const r = pm.response.json(); pm.collectionVariables.set("token", r.access_token); }
    language: text/javascript
order: 9300
