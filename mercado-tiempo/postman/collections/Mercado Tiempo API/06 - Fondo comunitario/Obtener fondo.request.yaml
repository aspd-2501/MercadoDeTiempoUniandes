$kind: http-request
url: "{{baseUrl}}/depositos-horas/fondo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Es el fondo guardado", () => { const r = pm.response.json(); pm.expect(r.id).to.eql(pm.collectionVariables.get("fondoId")); });
      { const r = pm.response.json(); pm.collectionVariables.set("saldoFondoInicial", r.saldo); }
    language: text/javascript
order: 2000
