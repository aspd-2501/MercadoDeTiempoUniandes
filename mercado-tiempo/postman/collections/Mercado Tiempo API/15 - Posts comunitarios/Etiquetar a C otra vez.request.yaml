$kind: http-request
url: "{{baseUrl}}/posts-comunitarios/{{postComId}}/participantes/{{perfilC}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 412", () => pm.response.to.have.status(412));
      pm.test("Mensaje: already a participante", () => { const r = pm.response.json(); pm.expect(String(r.message)).to.include("already a participante"); });
    language: text/javascript
order: 12000
