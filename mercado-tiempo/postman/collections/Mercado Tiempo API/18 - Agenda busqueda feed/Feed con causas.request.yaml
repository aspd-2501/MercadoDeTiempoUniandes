$kind: http-request
url: "{{baseUrl}}/feed?tipos=POST_AYUDA,POST_COMUNITARIO,CAUSA&q=Bruno {{runId}}&tamano=50"
method: GET
queryParams:
  tipos: POST_AYUDA,POST_COMUNITARIO,CAUSA
  q: "Bruno {{runId}}"
  tamano: "50"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Incluye la causa creada", () => { const r = pm.response.json(); const c = r.publicaciones.find(p => p.id === pm.collectionVariables.get("causaId")); pm.expect(c).to.exist; pm.expect(c.tipo).to.eql("CAUSA"); });
    language: text/javascript
order: 17200
