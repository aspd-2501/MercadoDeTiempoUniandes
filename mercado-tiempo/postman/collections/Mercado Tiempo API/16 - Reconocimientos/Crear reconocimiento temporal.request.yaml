$kind: http-request
url: "{{baseUrl}}/reconocimientos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Temporal {{runId}}",
      "descripcion": "Por ayudar a sus compañeros",
      "requerimiento": "Completar 1 tutoría",
      "icono": "star"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      { const r = pm.response.json(); pm.collectionVariables.set("recTmp", r.id); }
    language: text/javascript
order: 13000
